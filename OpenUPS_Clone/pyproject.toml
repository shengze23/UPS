[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openups-clone"
version = "0.2.0"
description = "Clean-room, read-only-first OpenUPS configuration GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "hidapi>=0.14,<1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["openups*", "gui*"]
